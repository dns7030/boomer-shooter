<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lizards Over Rus</title>
<link rel="icon" href="data:,">
<style>
  :root { --red:#b4352a; --gold:#d9a62a; --cream:#f0e6c8; --ink:#1a1210; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family: Georgia, 'Times New Roman', serif; color: var(--cream); user-select:none; }
  #view { position:fixed; inset:0; width:100%; height:100%; image-rendering: pixelated; display:block; }
  #weapon { position:fixed; left:56%; bottom:0; width:min(46vw, 84vh); aspect-ratio: 160/120; transform: translateX(-42%); image-rendering: pixelated; pointer-events:none; }
  #hurt { position:fixed; inset:0; background: radial-gradient(ellipse at center, rgba(160,0,0,0) 40%, rgba(160,0,0,.85) 100%); opacity:0; pointer-events:none; }
  #cross { position:fixed; left:50%; top:50%; width:14px; height:14px; transform:translate(-50%,-50%); pointer-events:none; }
  #cross::before, #cross::after { content:''; position:absolute; background: rgba(255,255,255,.85); box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
  #cross::before { left:6px; top:0; width:2px; height:14px; }
  #cross::after { top:6px; left:0; height:2px; width:14px; }
  #hud { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:space-between; align-items:flex-end; padding: 14px 20px; pointer-events:none; text-shadow: 2px 2px 0 #000; }
  .panel { background: rgba(26,18,16,.78); border: 2px solid var(--gold); padding: 8px 14px; min-width: 150px; }
  .panel small { display:block; font-size:11px; letter-spacing:2px; color: var(--gold); }
  .big { font-size: 34px; font-weight:bold; line-height:1.1; }
  #hpbar-w { height:6px; background:#400; margin-top:4px; } #hpbar { height:100%; background: var(--red); width:100%; }
  #wname { font-size:16px; } #ammo { font-size: 26px; font-weight:bold; }
  #slots { display:flex; gap:6px; margin-top:6px; }
  .slot { width:26px; height:26px; border:2px solid #6a5a30; text-align:center; line-height:22px; font-size:14px; color:#6a5a30; }
  .slot.on { border-color: var(--gold); color: var(--gold); background: rgba(217,166,42,.15); }
  .slot.locked { opacity:.3; }
  #top { position:fixed; top:12px; left:0; right:0; text-align:center; pointer-events:none; text-shadow:2px 2px 0 #000; }
  #wave { font-size:15px; letter-spacing:3px; color: var(--gold); }
  #msg { margin-top:10px; font-size:24px; letter-spacing:2px; min-height:30px; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background: radial-gradient(ellipse at center, rgba(20,10,10,.7), rgba(0,0,0,.92)); cursor:pointer; padding:20px; }
  #overlay h1 { font-size: clamp(30px, 6vw, 64px); margin:0 0 6px; letter-spacing:4px; color: var(--gold); text-shadow: 3px 3px 0 var(--red); }
  #overlay .sub { font-style:italic; margin-bottom: 22px; opacity:.85; }
  #overlay p { max-width: 560px; line-height:1.5; margin: 0 0 18px; }
  #ov-btn { font: inherit; font-size:22px; letter-spacing:3px; padding: 10px 34px; background: var(--red); color: var(--cream); border: 3px solid var(--gold); cursor:pointer; }
  #ov-btn:hover { background:#d04535; }
  .keys { display:grid; grid-template-columns: auto auto; gap: 4px 18px; font-size:14px; margin-bottom:22px; text-align:left; }
  .keys b { color: var(--gold); }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="weapon" width="160" height="120"></canvas>
<div id="hurt"></div>
<div id="cross"></div>
<div id="top"><div id="wave">GET READY</div><div id="msg"></div></div>
<div id="hud">
  <div class="panel"><small>HEALTH</small><div class="big" id="hp">100</div><div id="hpbar-w"><div id="hpbar"></div></div></div>
  <div class="panel" style="text-align:right"><small id="wname-l">WEAPON</small><div id="wname">—</div><div id="ammo">—</div>
    <div id="slots" style="justify-content:flex-end"><div class="slot">1</div><div class="slot">2</div><div class="slot locked">3</div><div class="slot locked">4</div></div></div>
</div>
<div id="overlay">
  <h1 id="ov-title">LIZARDS OVER RUS</h1>
  <div class="sub">Muscovy, 1550s — something has come down from the sky.</div>
  <p id="ov-body">Hold the street against the lizard invaders. Find the blunderbuss and the organ gun along the way.</p>
  <div class="keys"><span><b>WASD</b> move</span><span><b>MOUSE</b> look</span><span><b>CLICK</b> fire / swing</span><span><b>SPACE</b> jump</span><span><b>1–4 / WHEEL</b> weapons</span><span><b>SHIFT</b> run</span></div>
  <button id="ov-btn">PLAY</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
